name: CI

on:
  push:
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang-format

      - name: Build
        run: make

      - name: Run tests
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic tests.cpp kvstore.cpp -o tests
          ./tests

      - name: Lint
        run: |
          clang-format --dry-run --Werror main.cpp kvstore.cpp kvstore.h tests.cpp
